<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>

  <!-- terminal window -->
  <rect x="56" y="92" width="688" height="236" rx="10" fill="#0b1017" stroke="#2b3a4a" stroke-width="1.5"/>
  <rect x="56" y="92" width="688" height="34" rx="10" fill="#16202c"/>
  <rect x="56" y="116" width="688" height="10" fill="#16202c"/>
  <circle cx="80" cy="109" r="6" fill="#ff5f57"/>
  <circle cx="102" cy="109" r="6" fill="#febc2e"/>
  <circle cx="124" cy="109" r="6" fill="#28c840"/>
  <text x="400" y="114" font-family="SFMono-Regular,Consolas,monospace" font-size="13" fill="#7f95ab" text-anchor="middle">mcr.microsoft.com/dotnet/sdk:10.0</text>

  <text x="84" y="164" font-family="SFMono-Regular,Consolas,monospace" font-size="15" fill="#4dd0e1">$ seedfolder --version</text>

  <text x="84" y="200" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#ff6b6b">You must install or update .NET to run this application.</text>
  <text x="84" y="224" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#8fa6bc">Framework: 'Microsoft.NETCore.App', version '8.0.0'</text>
  <text x="84" y="248" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#8fa6bc">The following frameworks were found:</text>
  <text x="84" y="272" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#febc2e">  10.0.10 at [/usr/share/dotnet/shared/...]</text>

  <text x="84" y="306" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#28c840">fix: &lt;RollForward&gt;Major&lt;/RollForward&gt;</text>

  <text x="56" y="62" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef4fa">.NET tools stop working when you upgrade .NET</text>
  <text x="56" y="366" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#8fa6bc">Roll-forward does not cross major versions. One property fixes it.</text>
</svg>
