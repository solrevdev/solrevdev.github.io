<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#174ea6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#202124;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keptBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9ab00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8710a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="60" cy="60" r="130" fill="rgba(255,255,255,0.025)"/>
  <circle cx="740" cy="360" r="160" fill="rgba(255,255,255,0.025)"/>

  <!-- Title -->
  <text x="400" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">GA4 Data Retention</text>

  <!-- Panel -->
  <rect x="70" y="88" width="660" height="252" rx="10" fill="url(#panelGradient)" stroke="#374151" stroke-width="2"/>

  <!-- Panel header -->
  <rect x="70" y="88" width="660" height="30" rx="10" fill="#374151"/>
  <rect x="70" y="108" width="660" height="10" fill="#374151"/>
  <rect x="70" y="117" width="660" height="2" fill="#4b5563"/>
  <circle cx="90" cy="103" r="5" fill="#ef4444"/>
  <circle cx="105" cy="103" r="5" fill="#f59e0b"/>
  <circle cx="120" cy="103" r="5" fill="#10b981"/>
  <text x="400" y="108" font-family="monospace" font-size="12" fill="#d1d5db" text-anchor="middle">Admin &#8226; Data retention &#8226; Event data</text>

  <!-- Labels above the bars -->
  <text x="270" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9ca3af" text-anchor="middle">12 months deleted</text>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f9ab00" text-anchor="middle">kept</text>

  <!-- Deleted months: dashed hollow bars -->
  <rect x="100" y="232" width="26" height="48" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="138" y="216" width="26" height="64" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="176" y="240" width="26" height="40" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="214" y="200" width="26" height="80" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="252" y="224" width="26" height="56" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="290" y="192" width="26" height="88" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="328" y="236" width="26" height="44" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="366" y="208" width="26" height="72" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="404" y="228" width="26" height="52" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="442" y="196" width="26" height="84" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="480" y="220" width="26" height="60" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="518" y="204" width="26" height="76" rx="3" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- The cut line -->
  <line x1="562" y1="164" x2="562" y2="298" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="562" y="316" font-family="monospace" font-size="11" fill="#ef4444" text-anchor="middle">2 months ago</text>

  <!-- Kept months: solid bars -->
  <rect x="580" y="188" width="26" height="92" rx="3" fill="url(#keptBar)"/>
  <rect x="618" y="212" width="26" height="68" rx="3" fill="url(#keptBar)"/>
  <rect x="656" y="176" width="26" height="104" rx="3" fill="url(#keptBar)"/>
  <rect x="694" y="204" width="26" height="76" rx="3" fill="url(#keptBar)"/>

  <!-- Baseline -->
  <line x1="90" y1="280" x2="726" y2="280" stroke="#4b5563" stroke-width="2"/>

  <!-- Setting readout -->
  <text x="100" y="316" font-family="monospace" font-size="13" fill="#9ca3af">Event data retention:</text>
  <text x="272" y="316" font-family="monospace" font-size="13" fill="#ef4444">2 months</text>
  <text x="352" y="316" font-family="monospace" font-size="13" fill="#9ca3af">&#8594;</text>
  <text x="376" y="316" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">14 months</text>

  <!-- Subtitle -->
  <text x="400" y="374" font-family="Arial, sans-serif" font-size="18" fill="#c3d9ff" text-anchor="middle">The default that quietly deletes your data</text>

  <!-- Decorative Elements -->
  <circle cx="752" cy="46" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="730" cy="66" r="2" fill="#34d399" opacity="0.8"/>
  <circle cx="770" cy="76" r="4" fill="#60a5fa" opacity="0.7"/>
  <circle cx="48" cy="46" r="2" fill="#f472b6" opacity="0.6"/>
  <circle cx="30" cy="76" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="66" cy="70" r="2" fill="#34d399" opacity="0.7"/>
</svg>
