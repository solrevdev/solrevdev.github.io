<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#0747a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#172b4d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="60" cy="60" r="130" fill="rgba(255,255,255,0.025)"/>
  <circle cx="740" cy="360" r="160" fill="rgba(255,255,255,0.025)"/>

  <!-- Title -->
  <text x="400" y="58" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">bbx</text>

  <!-- Terminal Window -->
  <rect x="70" y="88" width="660" height="252" rx="10" fill="url(#terminalGradient)" stroke="#374151" stroke-width="2"/>

  <!-- Terminal Header -->
  <rect x="70" y="88" width="660" height="30" rx="10" fill="#374151"/>
  <rect x="70" y="108" width="660" height="10" fill="#374151"/>
  <rect x="70" y="117" width="660" height="2" fill="#4b5563"/>

  <!-- Terminal Controls -->
  <circle cx="90" cy="103" r="5" fill="#ef4444"/>
  <circle cx="105" cy="103" r="5" fill="#f59e0b"/>
  <circle cx="120" cy="103" r="5" fill="#10b981"/>

  <!-- Terminal Title -->
  <text x="400" y="108" font-family="monospace" font-size="12" fill="#d1d5db" text-anchor="middle">bbx &#8226; Bitbucket Cloud CLI</text>

  <!-- Command Line -->
  <text x="90" y="146" font-family="monospace" font-size="14" fill="#10b981">$</text>
  <text x="105" y="146" font-family="monospace" font-size="14" fill="#f3f4f6">bbx pr list -r api --state OPEN</text>

  <!-- JSON Output -->
  <text x="90" y="176" font-family="monospace" font-size="13" fill="#60a5fa">{</text>
  <text x="105" y="198" font-family="monospace" font-size="12" fill="#fbbf24">  "workspace":</text>
  <text x="200" y="198" font-family="monospace" font-size="12" fill="#34d399">"myteam"</text>
  <text x="105" y="220" font-family="monospace" font-size="12" fill="#fbbf24">  "count":</text>
  <text x="170" y="220" font-family="monospace" font-size="12" fill="#c4b5fd">2</text>
  <text x="105" y="242" font-family="monospace" font-size="12" fill="#fbbf24">  "pull_requests":</text>
  <text x="228" y="242" font-family="monospace" font-size="12" fill="#60a5fa">[</text>
  <text x="120" y="264" font-family="monospace" font-size="12" fill="#9ca3af">    { "id": 42, "title": "feat: add retry policy" }</text>
  <text x="105" y="286" font-family="monospace" font-size="12" fill="#60a5fa">  ]</text>
  <text x="90" y="308" font-family="monospace" font-size="13" fill="#60a5fa">}</text>

  <!-- Bitbucket mark -->
  <g transform="translate(660, 150)">
    <path d="M0 0 L32 0 L27 42 L5 42 Z" fill="#2684ff" opacity="0.85"/>
    <path d="M5 42 L27 42 L24 72 L8 72 Z" fill="#0052cc" opacity="0.85"/>
  </g>

  <!-- .NET 10 badge -->
  <g transform="translate(636, 240)">
    <rect x="0" y="0" width="82" height="26" rx="5" fill="#512bd4"/>
    <text x="41" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">.NET 10</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="374" font-family="Arial, sans-serif" font-size="18" fill="#b3d4ff" text-anchor="middle">Bitbucket Cloud CLI &#8226; .NET Global Tool</text>

  <!-- Decorative Elements -->
  <circle cx="752" cy="46" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="730" cy="66" r="2" fill="#34d399" opacity="0.8"/>
  <circle cx="770" cy="76" r="4" fill="#60a5fa" opacity="0.7"/>
  <circle cx="48" cy="46" r="2" fill="#f472b6" opacity="0.6"/>
  <circle cx="30" cy="76" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="66" cy="70" r="2" fill="#34d399" opacity="0.7"/>
</svg>
